name: Atrium Signal Harvester

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night
  workflow_dispatch: # Allows you to click the button to run manually

jobs:
  harvest_competitions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Harvester Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HARVESTER_SECRET: ${{ secrets.HARVESTER_SECRET }}
        run: |
          python harvester.py
          
